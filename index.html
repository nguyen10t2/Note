<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghi chú nhanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════
       DARK THEME (mặc định)
    ═══════════════════════════════════════ */
    :root {
      --bg: #06060e;
      --bg2: #0c0c18;
      --surface: rgba(255,255,255,0.025);
      --surface-hover: rgba(255,255,255,0.055);
      --surface-solid: #141422;
      --text: #ece8f5;
      --text2: #9e96b8;
      --muted: #554e6e;
      --border: rgba(255,255,255,0.05);
      --border-focus: rgba(180,160,255,0.4);
      --accent: #b4a0ff;
      --accent2: #8b6cff;
      --gold: #e8b84a;
      --gold2: #f0d080;
      --rose: #f472b6;
      --teal: #5eead4;
      --danger: #ff6b6b;
      --danger-soft: rgba(255,107,107,0.1);
      --gradient-main: linear-gradient(135deg, #8b6cff, #b4a0ff 40%, #e8b84a 80%, #f472b6);
      --gradient-warm: linear-gradient(135deg, #e8b84a, #f472b6);
      --gradient-cool: linear-gradient(135deg, #5eead4, #8b6cff);
      --primary-bg: var(--gradient-main);
      --primary-text: #06060e;
      --glow-purple: rgba(139,108,255,0.2);
      --glow-gold: rgba(232,184,74,0.15);
      --glow-rose: rgba(244,114,182,0.12);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.5);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.55);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.65);
      --shadow-glow: 0 0 100px rgba(139,108,255,0.07);
      --radius: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --backdrop: blur(40px) saturate(1.5);
      --aurora1: rgba(139,108,255,0.14);
      --aurora2: rgba(180,160,255,0.08);
      --aurora3: rgba(232,184,74,0.07);
      --aurora4: rgba(244,114,182,0.06);
      --aurora5: rgba(94,234,212,0.05);
    }

    /* ═══════════════════════════════════════
       LIGHT THEME
    ═══════════════════════════════════════ */
    [data-theme="light"] {
      --bg: #f8f6fd;
      --bg2: #ede8f5;
      --surface: rgba(255,255,255,0.72);
      --surface-hover: rgba(255,255,255,0.92);
      --surface-solid: #ffffff;
      --text: #1a1430;
      --text2: #4a4068;
      --muted: #8a80a8;
      --border: rgba(0,0,0,0.06);
      --border-focus: rgba(139,108,255,0.35);
      --accent: #7c5cbf;
      --accent2: #9b7bff;
      --gold: #b8860b;
      --gold2: #d4a030;
      --rose: #db2777;
      --teal: #0d9488;
      --danger: #dc4545;
      --danger-soft: rgba(220,69,69,0.08);
      --gradient-main: linear-gradient(135deg, #7c5cbf, #9b7bff 40%, #b8860b 80%, #db2777);
      --gradient-warm: linear-gradient(135deg, #b8860b, #db2777);
      --gradient-cool: linear-gradient(135deg, #0d9488, #7c5cbf);
      --primary-bg: var(--gradient-main);
      --primary-text: #ffffff;
      --glow-purple: rgba(139,108,255,0.12);
      --glow-gold: rgba(184,134,11,0.08);
      --glow-rose: rgba(219,39,119,0.06);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.08);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.12);
      --shadow-glow: 0 0 80px rgba(139,108,255,0.06);
      --aurora1: rgba(139,108,255,0.07);
      --aurora2: rgba(180,160,255,0.05);
      --aurora3: rgba(184,134,11,0.04);
      --aurora4: rgba(219,39,119,0.04);
      --aurora5: rgba(13,148,136,0.03);
    }

    /* ═══════════════════════════════════════
       RESET
    ═══════════════════════════════════════ */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      transition: background 0.6s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════
       CANVAS PARTICLES — dots + connections
    ═══════════════════════════════════════ */
    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ═══════════════════════════════════════
       AURORA — 5 blobs gradient
    ═══════════════════════════════════════ */
    .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(120px); will-change: transform;
      animation-timing-function: cubic-bezier(0.45,0.05,0.55,0.95);
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .blob:nth-child(1) {
      width: 55vw; height: 55vw; max-width: 680px; max-height: 680px;
      background: var(--aurora1); top: -12%; left: -8%;
      animation: b1 22s infinite alternate;
    }
    .blob:nth-child(2) {
      width: 48vw; height: 48vw; max-width: 580px; max-height: 580px;
      background: var(--aurora2); bottom: -10%; right: -6%;
      animation: b2 28s infinite alternate;
    }
    .blob:nth-child(3) {
      width: 38vw; height: 38vw; max-width: 460px; max-height: 460px;
      background: var(--aurora3); top: 25%; left: 50%;
      animation: b3 18s infinite alternate;
    }
    .blob:nth-child(4) {
      width: 30vw; height: 30vw; max-width: 380px; max-height: 380px;
      background: var(--aurora4); top: 65%; left: 10%;
      animation: b4 25s infinite alternate;
    }
    .blob:nth-child(5) {
      width: 25vw; height: 25vw; max-width: 320px; max-height: 320px;
      background: var(--aurora5); top: 10%; right: 15%;
      animation: b5 20s infinite alternate;
    }
    @keyframes b1 {
      0%   { transform: translate(0,0) scale(1) rotate(0deg); }
      33%  { transform: translate(90px,70px) scale(1.06) rotate(8deg); }
      66%  { transform: translate(-50px,120px) scale(0.94) rotate(-6deg); }
      100% { transform: translate(40px,40px) scale(1.03) rotate(4deg); }
    }
    @keyframes b2 {
      0%   { transform: translate(0,0) scale(1) rotate(0deg); }
      33%  { transform: translate(-80px,-90px) scale(1.08) rotate(-10deg); }
      66%  { transform: translate(70px,-40px) scale(0.92) rotate(7deg); }
      100% { transform: translate(-30px,-60px) scale(1.04) rotate(-3deg); }
    }
    @keyframes b3 {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(-130px,70px) scale(1.12); }
      100% { transform: translate(60px,-50px) scale(0.9); }
    }
    @keyframes b4 {
      0%   { transform: translate(0,0) scale(1); }
      40%  { transform: translate(100px,-70px) scale(1.08); }
      80%  { transform: translate(-60px,50px) scale(0.93); }
      100% { transform: translate(30px,-20px) scale(1.03); }
    }
    @keyframes b5 {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(-80px,60px) scale(1.1); }
      100% { transform: translate(50px,-40px) scale(0.92); }
    }

    /* ═══════════════════════════════════════
       MOUSE GLOW — theo con trỏ
    ═══════════════════════════════════════ */
    .cursor-glow {
      position: fixed; width: 500px; height: 500px;
      border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, var(--glow-purple) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      opacity: 0; transition: opacity 0.8s ease;
      will-change: transform;
    }
    .cursor-glow.active { opacity: 1; }

    /* ═══════════════════════════════════════
       APP CONTAINER
    ═══════════════════════════════════════ */
    .app {
      position: relative; z-index: 1;
      max-width: 740px; margin: 0 auto;
      padding: 36px 22px 90px;
    }

    /* ═══════════════════════════════════════
       HEADER
    ═══════════════════════════════════════ */
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 36px;
      animation: enterDown 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes enterDown {
      from { opacity: 0; transform: translateY(-28px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand { display: flex; align-items: center; gap: 16px; }

    .brand-icon {
      width: 54px; height: 54px; border-radius: 18px;
      background: var(--primary-bg); color: var(--primary-text);
      display: grid; place-items: center;
      font-size: 1.3rem; font-weight: 900;
      box-shadow: 0 4px 24px var(--glow-purple);
      position: relative; overflow: hidden;
      transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
    }
    .brand-icon::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: shimmer 3.5s ease infinite;
    }
    @keyframes shimmer {
      0%,25% { transform: translateX(-120%); }
      50%,75% { transform: translateX(120%); }
      100% { transform: translateX(120%); }
    }
    .brand-icon:hover { transform: rotate(-8deg) scale(1.12); }

    header h1 {
      font-size: 1.75rem; font-weight: 900; letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--gold) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShift 6s ease infinite;
    }
    @keyframes titleShift {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .brand-sub {
      font-size: 0.82rem; color: var(--muted); margin-top: 5px;
      display: flex; align-items: center; gap: 8px; font-weight: 500;
    }
    .brand-sub .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold);
      animation: pulseDot 2s ease infinite;
    }
    @keyframes pulseDot {
      0%,100% { box-shadow: 0 0 0 0 var(--glow-gold); opacity: 1; }
      50% { box-shadow: 0 0 0 6px transparent; opacity: 0.5; }
    }

    /* ═══════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════ */
    .btn {
      border: 1px solid var(--border); background: var(--surface);
      backdrop-filter: var(--backdrop); -webkit-backdrop-filter: var(--backdrop);
      color: var(--text); padding: 12px 22px; border-radius: 999px;
      font-size: 0.88rem; font-weight: 600; font-family: inherit;
      cursor: pointer; outline: none;
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
      position: relative; overflow: hidden;
    }
    .btn:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.96); transition-duration: 0.1s; }

    .btn-primary {
      background: var(--primary-bg); color: var(--primary-text);
      border-color: transparent;
      box-shadow: 0 4px 24px var(--glow-purple);
    }
    .btn-primary:hover {
      box-shadow: 0 8px 40px var(--glow-purple), 0 4px 16px var(--glow-gold);
      transform: translateY(-3px);
    }

    .btn-icon {
      width: 48px; height: 48px; padding: 0;
      display: grid; place-items: center; font-size: 1.25rem;
      border-radius: 18px;
    }
    .btn-icon:hover { transform: translateY(-2px) rotate(25deg); }

    .btn-ghost {
      background: transparent; border: 1px solid transparent;
      color: var(--muted); padding: 6px 14px; font-size: 0.78rem;
      backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 999px;
    }
    .btn-ghost:hover {
      color: var(--danger); background: var(--danger-soft);
      border-color: transparent; transform: none; box-shadow: none;
    }

    /* ═══════════════════════════════════════
       TOOLBAR
    ═══════════════════════════════════════ */
    .toolbar {
      display: flex; gap: 14px; align-items: center; margin-bottom: 28px;
      animation: enterUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.08s both;
    }
    @keyframes enterUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .note-count {
      font-size: 0.78rem; color: var(--muted); margin-left: auto;
      padding: 7px 16px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      backdrop-filter: var(--backdrop); -webkit-backdrop-filter: var(--backdrop);
      font-weight: 600; transition: all 0.35s ease;
    }
    .note-count.pop { animation: popBounce 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popBounce { 0%,100% { transform: scale(1); } 40% { transform: scale(1.22); } }

    /* ═══════════════════════════════════════
       FORM
    ═══════════════════════════════════════ */
    .form-card {
      background: var(--surface); backdrop-filter: var(--backdrop);
      -webkit-backdrop-filter: var(--backdrop);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      padding: 32px; margin-bottom: 32px;
      animation: formSlideIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes formSlideIn {
      from { opacity: 0; transform: translateY(-18px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .form-card.closing { animation: formSlideOut 0.28s cubic-bezier(0.4,0,1,1) forwards; }
    @keyframes formSlideOut { to { opacity: 0; transform: translateY(-12px) scale(0.95); } }
    .form-card[hidden] { display: none; }

    .form-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    .form-top h2 { font-size: 1.08rem; font-weight: 800; }

    .typing-dots { display: flex; gap: 5px; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      animation: typingBounce 1.4s ease infinite;
    }
    .typing-dots span:nth-child(1) { background: var(--accent2); animation-delay: 0s; }
    .typing-dots span:nth-child(2) { background: var(--gold); animation-delay: 0.16s; }
    .typing-dots span:nth-child(3) { background: var(--rose); animation-delay: 0.32s; }
    @keyframes typingBounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    label {
      display: block; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--muted); margin: 18px 0 7px;
    }

    input[type="text"], textarea {
      width: 100%; border: 1.5px solid var(--border);
      border-radius: var(--radius-md); background: var(--bg2);
      color: var(--text); padding: 14px 18px;
      font-size: 0.95rem; font-family: inherit; outline: none;
      transition: border-color 0.3s, box-shadow 0.35s, background 0.3s;
    }
    input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.5; }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--glow-purple), 0 0 20px var(--glow-purple);
      background: var(--surface);
    }
    textarea { min-height: 125px; resize: vertical; line-height: 1.7; }

    .input-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .char-count { font-size: 0.72rem; color: var(--muted); font-weight: 600; transition: color 0.3s; }
    .char-count.warn { color: var(--danger); }

    .form-actions { display: flex; gap: 12px; margin-top: 20px; }

    /* ═══════════════════════════════════════
       NOTES GRID
    ═══════════════════════════════════════ */
    .notes { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 600px) { .notes { grid-template-columns: 1fr 1fr; } }

    /* ═══════════════════════════════════════
       NOTE CARD
    ═══════════════════════════════════════ */
    .note {
      background: var(--surface); backdrop-filter: var(--backdrop);
      -webkit-backdrop-filter: var(--backdrop);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; display: flex; flex-direction: column; gap: 12px;
      position: relative; overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .note.entering { animation: cardEnter 0.6s cubic-bezier(0.16,1,0.3,1) both; }
    .note:nth-child(1).entering { animation-delay: 0s; }
    .note:nth-child(2).entering { animation-delay: 0.07s; }
    .note:nth-child(3).entering { animation-delay: 0.14s; }
    .note:nth-child(4).entering { animation-delay: 0.21s; }
    .note:nth-child(5).entering { animation-delay: 0.28s; }
    .note:nth-child(6).entering { animation-delay: 0.35s; }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(28px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Accent gradient stripe */
    .note::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--gradient-main); background-size: 200% 100%;
      opacity: 0; transition: opacity 0.4s;
      animation: stripeShimmer 4s ease infinite;
    }
    @keyframes stripeShimmer {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .note:hover::before { opacity: 1; }

    /* Glow on hover */
    .note::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% -10%, var(--glow-purple), transparent 65%);
      opacity: 0; transition: opacity 0.45s; pointer-events: none;
    }
    .note:hover::after { opacity: 1; }

    .note:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      border-color: var(--border-focus);
    }

    .note.removing {
      animation: cardRemove 0.45s cubic-bezier(0.4,0,1,1) forwards;
    }
    @keyframes cardRemove {
      0% { opacity: 1; transform: scale(1); filter: blur(0); }
      100% { opacity: 0; transform: scale(0.85) translateY(-14px); filter: blur(6px); }
    }

    /* Accent bar per card color */
    .note-color {
      position: absolute; top: 14px; right: 16px;
      width: 10px; height: 10px; border-radius: 50%;
      opacity: 0.6; transition: all 0.3s;
    }
    .note:hover .note-color { opacity: 1; transform: scale(1.3); }

    .note h3 {
      font-size: 1.05rem; font-weight: 700; line-height: 1.45;
      word-break: break-word; position: relative; z-index: 1;
    }
    .note p {
      font-size: 0.88rem; color: var(--text2); white-space: pre-wrap;
      word-break: break-word; flex: 1; line-height: 1.7;
      position: relative; z-index: 1;
    }
    .note-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 14px; border-top: 1px solid var(--border);
      position: relative; z-index: 1;
    }
    .note time { font-size: 0.7rem; color: var(--muted); font-weight: 500; }

    /* ═══════════════════════════════════════
       EMPTY STATE
    ═══════════════════════════════════════ */
    .empty {
      text-align: center; padding: 80px 20px; color: var(--muted);
      animation: fadeIn 0.8s ease 0.35s both;
    }
    .empty-icon {
      font-size: 4rem; margin-bottom: 20px;
      animation: emptySpin 4s ease-in-out infinite;
    }
    @keyframes emptySpin {
      0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-8px) rotate(5deg) scale(1.05); }
      50% { transform: translateY(-12px) rotate(0deg) scale(1.1); }
      75% { transform: translateY(-6px) rotate(-5deg) scale(1.03); }
    }
    .empty h3 { font-size: 1.2rem; color: var(--text2); margin-bottom: 8px; font-weight: 800; }
    .empty p { font-size: 0.88rem; }

    /* ═══════════════════════════════════════
       TOAST
    ═══════════════════════════════════════ */
    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(28px) scale(0.9);
      background: var(--surface-solid); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 14px 30px; font-size: 0.86rem; font-weight: 600;
      box-shadow: var(--shadow-lg); z-index: 200;
      opacity: 0; pointer-events: none;
      backdrop-filter: var(--backdrop); -webkit-backdrop-filter: var(--backdrop);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0) scale(1);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ═══════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 999px; }

    /* ═══════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════ */
    @media (max-width: 480px) {
      .app { padding: 22px 14px 70px; }
      header h1 { font-size: 1.4rem; }
      .brand-icon { width: 46px; height: 46px; font-size: 1.15rem; }
      .form-card { padding: 22px; }
      .note { padding: 20px; }
    }
  </style>
</head>

<body>
  <div class="aurora">
    <div class="blob"></div><div class="blob"></div>
    <div class="blob"></div><div class="blob"></div>
    <div class="blob"></div>
  </div>
  <canvas id="particles"></canvas>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div id="toast" class="toast"></div>

  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-icon">N</div>
        <div>
          <h1>Ghi chú nhanh</h1>
          <div class="brand-sub"><span class="pulse-dot"></span> Tự động lưu trên trình duyệt</div>
        </div>
      </div>
      <button id="themeToggle" class="btn btn-icon" title="Chế độ sáng/tối">☀️</button>
    </header>

    <div class="toolbar">
      <button id="addBtn" class="btn btn-primary">+ Thêm ghi chú</button>
      <span id="noteCount" class="note-count">0 ghi chú</span>
    </div>

    <section id="formCard" class="form-card" hidden>
      <div class="form-top">
        <h2>Ghi chú mới</h2>
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
      <label for="titleInput">Tiêu đề</label>
      <input id="titleInput" type="text" placeholder="Việc cần làm hôm nay…" maxlength="120" />
      <label for="contentInput">Nội dung</label>
      <textarea id="contentInput" placeholder="Nhập nội dung ghi chú…" maxlength="2000"></textarea>
      <div class="input-row">
        <span class="char-count" id="charCount">0 / 2000</span>
      </div>
      <div class="form-actions">
        <button id="saveBtn" class="btn btn-primary">Lưu ghi chú</button>
        <button id="cancelBtn" class="btn">Hủy</button>
      </div>
    </section>

    <div id="notes" class="notes"></div>

    <div id="emptyMsg" class="empty">
      <div class="empty-icon">✦</div>
      <h3>Chưa có ghi chú nào</h3>
      <p>Bấm "Thêm ghi chú" để bắt đầu</p>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════
   PARTICLE SYSTEM — dots + connection lines
═══════════════════════════════════════════ */
(() => {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let W, H, pts = [], mouse = { x: -1000, y: -1000 };
  const N = 60, LINK_DIST = 140;

  const palette = [
    [180,160,255], [232,184,74], [244,114,182],
    [94,234,212],  [139,108,255], [255,255,255]
  ];

  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
  addEventListener('resize', resize); resize();

  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });

  function mk() {
    const col = palette[Math.random() * palette.length | 0];
    return {
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 2 + 0.5,
      col, a: Math.random() * 0.45 + 0.1,
      ph: Math.random() * 6.28, ps: Math.random() * 0.01 + 0.004,
    };
  }
  for (let i = 0; i < N; i++) pts.push(mk());

  function loop() {
    ctx.clearRect(0, 0, W, H);

    /* update + draw particles */
    for (let i = 0; i < N; i++) {
      const p = pts[i];
      p.x += p.vx; p.y += p.vy; p.ph += p.ps;
      const a = p.a * (0.55 + 0.45 * Math.sin(p.ph));
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20;
      if (p.y > H + 20) p.y = -20;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.28);
      ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
      ctx.fill();

      /* connection lines */
      for (let j = i + 1; j < N; j++) {
        const q = pts[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d = dx * dx + dy * dy;
        if (d < LINK_DIST * LINK_DIST) {
          const la = (1 - Math.sqrt(d) / LINK_DIST) * 0.12;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${la})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ═══════════════════════════════════════════
   CURSOR GLOW — theo mouse
═══════════════════════════════════════════ */
(() => {
  const el = document.getElementById('cursorGlow');
  let mx = -500, my = -500, cx = -500, cy = -500;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; el.classList.add('active'); });
  document.addEventListener('mouseleave', () => el.classList.remove('active'));
  (function tick() {
    cx += (mx - cx) * 0.08;
    cy += (my - cy) * 0.08;
    el.style.transform = `translate(${cx - 250}px, ${cy - 250}px)`;
    requestAnimationFrame(tick);
  })();
})();

/* ═══════════════════════════════════════════
   APP
═══════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const addBtn=$('addBtn'), formCard=$('formCard'),
      titleInput=$('titleInput'), contentInput=$('contentInput'),
      saveBtn=$('saveBtn'), cancelBtn=$('cancelBtn'),
      notesEl=$('notes'), emptyMsg=$('emptyMsg'),
      themeToggle=$('themeToggle'), noteCountEl=$('noteCount'),
      charCountEl=$('charCount'), toastEl=$('toast');

const SK='quick_notes', TK='quick_notes_theme';
const COLORS = ['#b4a0ff','#e8b84a','#f472b6','#5eead4','#8b6cff','#f0d080'];

function load(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch{return[]}}
function persist(n){localStorage.setItem(SK,JSON.stringify(n))}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let tt;
function toast(m){toastEl.innerHTML=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2600)}

contentInput.addEventListener('input',()=>{
  const l=contentInput.value.length;
  charCountEl.textContent=`${l} / 2000`;
  charCountEl.classList.toggle('warn',l>1800);
});

function updateCount(){
  const c=load().length;
  noteCountEl.textContent=`${c} ghi chú`;
  noteCountEl.classList.remove('pop');
  void noteCountEl.offsetWidth;
  noteCountEl.classList.add('pop');
}

function render(){
  const notes=load();
  notesEl.innerHTML='';
  emptyMsg.style.display=notes.length?'none':'block';
  notes.forEach((n,i)=>{
    const el=document.createElement('article');
    el.className='note entering';
    const col=COLORS[n.colorIdx||0];
    el.innerHTML=`
      <span class="note-color" style="background:${col};box-shadow:0 0 12px ${col}44"></span>
      <h3>${esc(n.title)||'(Không tiêu đề)'}</h3>
      <p>${esc(n.content)}</p>
      <div class="note-footer">
        <time>${esc(n.createdAt)}</time>
        <button class="btn btn-ghost" data-id="${n.id}">✕ Xóa</button>
      </div>`;
    notesEl.appendChild(el);
  });
  updateCount();
}

let formOpen=false;
function openForm(){
  formCard.hidden=false;formCard.classList.remove('closing');
  formOpen=true;addBtn.textContent='✕ Đóng';addBtn.classList.remove('btn-primary');
  titleInput.value=contentInput.value='';
  charCountEl.textContent='0 / 2000';charCountEl.classList.remove('warn');
  setTimeout(()=>titleInput.focus(),120);
}
function closeForm(){
  formCard.classList.add('closing');formOpen=false;
  addBtn.textContent='+ Thêm ghi chú';addBtn.classList.add('btn-primary');
  setTimeout(()=>{formCard.hidden=true;formCard.classList.remove('closing')},280);
}
addBtn.addEventListener('click',()=>formOpen?closeForm():openForm());
cancelBtn.addEventListener('click',closeForm);

saveBtn.addEventListener('click',()=>{
  const t=titleInput.value.trim(),ct=contentInput.value.trim();
  if(!t&&!ct){toast('⚠️ Vui lòng nhập nội dung!');return;}
  const notes=load();
  notes.unshift({
    id:Date.now(),title:t,content:ct,
    colorIdx:Math.random()*COLORS.length|0,
    createdAt:new Date().toLocaleString('vi-VN')
  });
  persist(notes);render();closeForm();toast('✓ Đã lưu ghi chú');
});

notesEl.addEventListener('click',e=>{
  const btn=e.target.closest('.btn-ghost');if(!btn)return;
  const card=btn.closest('.note');
  card.classList.remove('entering');card.classList.add('removing');
  setTimeout(()=>{
    persist(load().filter(n=>n.id!==Number(btn.dataset.id)));
    render();toast('🗑️ Đã xóa ghi chú');
  },420);
});

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeToggle.textContent=t==='dark'?'☀️':'🌙';
  localStorage.setItem(TK,t);
}
themeToggle.addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});

applyTheme(localStorage.getItem(TK)||'dark');
render();
</script>
</body>
</html>
